{% extends "users/basic.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">
                    <h3 class="mb-0">Payment Gateway</h3>
                </div>

                <div class="card-body">

                    <h5 class="mb-3">
                        Booking Summary
                    </h5>

                    <div class="mb-3">

                        <p>
                            <strong>Movie:</strong>
                            {{ booking.movie.name }}
                        </p>

                        <p>
                            <strong>Theater:</strong>
                            {{ booking.theater.name }}
                        </p>

                        <p>
                            <strong>Seat:</strong>
                            {{ booking.seat.seat_number }}
                        </p>

                        <p>
                            <strong>Amount:</strong>
                            ₹{{ booking.amount }}
                        </p>

                    </div>

                    <hr>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Card Number
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="1234 5678 9012 3456"
                                required
                            >

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Expiry Date
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="MM/YY"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    CVV
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    placeholder="123"
                                    required
                                >

                            </div>

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-success btn-lg"
                            >
                                Pay ₹{{ booking.amount }}
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
